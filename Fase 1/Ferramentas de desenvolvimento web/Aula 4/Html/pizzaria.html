<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria</title>
</head>
<body>
    <form method="post" action="pizzaria.html">
    <h1>Pedido de pizza</h1>
    Nome: <input type="text" name="nome" > <br>
    Email: <input type="email" name="email"> <br>
    Tamanho:
    <input type="radio" name="Tamanho" value="g"> Grande
    <input type="radio" name="Tamanho" value="m"> Médio
    <input type="radio" name="Tamanho" value="p"> Pequeno
    <br>
    <select name="Sabor">
        <option>Calabresa</option>
        <option>Frango</option>
        <option>Chocolate</option>
        <option>Morango</option>
    </select>
    <br>
    Adicionais :
    <input type="checkbox" name="Borda" value="Sim">Borda
    <input type="checkbox" name="queijo" value="Sim"> queijo Extra <br>
    Data de entrega: <input type="date" name="data"> <br>
    Observações : <br>
    <textarea name="Observações" rows="10" cols="35"></textarea> <br>
    
    <input type="submit">

    </form>
</body>
</html>
